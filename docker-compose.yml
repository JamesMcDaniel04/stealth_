services:
  neo4j:
    image: neo4j:5.26
    container_name: reconcile-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/reconcile-dev"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    container_name: reconcile-postgres
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with a local Postgres on 5432
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile-dev
      POSTGRES_DB: reconcile
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The reconcile API service. Start with: docker-compose --profile api up -d
  api:
    build: .
    container_name: reconcile-api
    profiles: ["api"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://reconcile:reconcile-dev@postgres:5432/reconcile"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "reconcile-dev"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      RECONCILE_API_TOKEN: "${RECONCILE_API_TOKEN:-}"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  neo4j_data:
  pg_data:
