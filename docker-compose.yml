services:
  neo4j:
    image: neo4j:5.26
    container_name: reconcile-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/reconcile-dev"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    container_name: reconcile-postgres
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with a local Postgres on 5432
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile-dev
      POSTGRES_DB: reconcile
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j_data:
  pg_data:
